name: jellysort

services:
  jellysort:
    build: .
    image: jellysort:dev
    container_name: jellysort
    restart: unless-stopped
    # Image default is USER jellysort (non-root, plan 0.2); dev bind-mount needs root
    # because host-side logs/ and reports/ are owned by uid 0.
    user: "0:0"
    ports:
      - "18328:18327"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - /mnt/media1t/downloads:/media1
      - /mnt/media2t/downloads:/media2
      - /mnt/media3t/downloads:/media3
