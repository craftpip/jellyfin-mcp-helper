name: jellyfin-mcp-helper

services:
  organizer:
    build: .
    image: jellyfin-mcp-helper:dev
    container_name: jellyfin-mcp-helper
    restart: unless-stopped
    ports:
      - "18328:18327"
      - "18329:18329"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /home/boniface/www/jellyfin-mcp-helper:/app
      - /mnt/media1t/downloads:/media1
      - /mnt/media2t/downloads:/media2
      - /mnt/media3t/downloads:/media3
