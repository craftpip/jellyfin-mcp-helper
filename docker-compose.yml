name: jellysort

services:
  jellysort:
    build: .
    image: jellysort:dev
    container_name: jellysort
    restart: unless-stopped
    ports:
      - "18328:18327"
      - "18329:18329"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - /mnt/media1t/downloads:/media1
      - /mnt/media2t/downloads:/media2
      - /mnt/media3t/downloads:/media3
